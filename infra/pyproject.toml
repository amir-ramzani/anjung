[project]
name = "anjung-infra"
version = "0.1.0"
description = "Anjung AWS CDK app"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.277.0",
    "constructs>=10.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
