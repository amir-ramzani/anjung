[project]
name = "anjung"
version = "0.1.0"
description = "Anjung rental management backend"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.7",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "python-ulid>=4.2.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "C4", "SIM"]
ignore = ["B008", "N818", "E501", "UP046", "UP047"]  # B008: FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"tests/unit/test_worker.py" = ["N803"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "ulid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.17",
    "moto[dynamodb,kms,server]>=5.2.5",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
