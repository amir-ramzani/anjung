server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # API on the same origin, so CORS does not come into it
    location /v1/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /dev/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # installable app (PWA): the manifest needs its own type; the service worker is never cached, so updates arrive
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
