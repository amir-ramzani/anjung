<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Offline · Anjung</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --text: #0f172a; --muted: #475569; --teal: #0f766e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --text: #e2e8f0; --muted: #94a3b8; --teal: #5eead4; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, sans-serif; padding: 1rem; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    img { width: 72px; height: 72px; }
    p { color: var(--muted); }
    button { font: inherit; padding: .6rem 1.2rem; border-radius: .5rem; border: 0; background: #0f766e; color: #fff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #5eead4; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You are offline</h1>
    <p>Anjung needs an internet connection to show your bills, payments and repairs. Check your connection and try again.</p>
    <p lang="ms">Anda di luar talian. Anjung memerlukan sambungan internet. Semak sambungan anda dan cuba lagi.</p>
    <button type="button" onclick="location.reload()">Try again / Cuba lagi</button>
  </main>
</body>
</html>
